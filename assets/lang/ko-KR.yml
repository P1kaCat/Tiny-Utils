Welcome.Pitch: "Tiny Glade는 독특한 성과 포근한 오두막, 낭만적인 폐허를 그리는 작은 디오라마 제작 게임이에요. 관리도, 전투도, 목표도 필요 없어요. 느긋하게 자리에 앉아 잊힌 숲을 사랑스러운 디오라마로 바꿔 보세요."
