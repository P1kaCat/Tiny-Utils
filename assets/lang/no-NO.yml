Welcome.Pitch: "Tiny Glade er et avslappende spill hvor du drodler finurlige slott, hyggelige hytter og romantiske ruiner. Det er ingenting å holde styr på, ingen å sloss mot og ingen mål å jage etter. Så senk skuldrene og slapp av, for nå er det bare deg og lysningen som gjelder."
